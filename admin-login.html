<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #000428, #004e92);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
     



        .login-box {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: gold;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 20px;
        }
        
.back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  background: #f5c542;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  z-index: 1000;
  width: auto;   /* Add this */
}

.back-btn:hover {
  background: #ffd60a;
}
    </style>
</head>
<body>
    <button class="back-btn" onclick="goBack()">← Back</button>

<div class="login-box">
    <h1>Admin Login</h1>

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>
</div>

<script>
function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === "admin" && password === "1234!") {
        alert("Login Successful");
        window.location.href = "admin.html";
    } else {
        alert("Invalid Username or Password");
    }
}
function goBack() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
