<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poornima Talkies</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000814;
      color: white;
    }

    nav {
      background: rgba(0,0,0,0.7);
      padding: 18px 60px;
      position: fixed;
      width: 100%;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav h2 {
      color: white;
      font-size: 28px;
    }

    nav span {
      color: #f5c542;
    }

    .nav-buttons {
      display: flex;
      gap: 15px;
    }

    .nav-buttons button {
      background: #f5c542;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .nav-buttons button:hover {
      background: #ffd60a;
    }

    .hero {
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
      url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      padding: 80px;
    }

    .hero-content {
      max-width: 650px;
    }

    .hero-content h1 {
      font-size: 60px;
      line-height: 1.3;
      margin-bottom: 20px;
    }

    .hero-content span {
      color: #f5c542;
    }

    .hero-content p {
      font-size: 22px;
      color: #ddd;
      margin-bottom: 30px;
    }

    .hero-content button {
      background: #f5c542;
      border: none;
      padding: 15px 35px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .hero-content button:hover {
      background: #ffd60a;
      transform: scale(1.05);
    }

    .section-title {
      text-align: center;
      margin: 70px 0 40px;
      font-size: 40px;
    }

    .movie-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 35px;
      padding: 0 50px 80px;
    }

    .movie-card {
      background: #071b45;
      border-radius: 20px;
      width: 280px;
      overflow: hidden;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.4);
      transition: 0.3s;
    }

    .movie-card:hover {
      transform: translateY(-8px);
    }

    .movie-card img {
      width: 100%;
      height: 360px;
      object-fit: cover;
    }

    .movie-info {
      padding: 20px;
    }

    .movie-info h3 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .movie-info p {
      margin: 8px 0;
      color: #ddd;
      font-size: 15px;
    }

    .movie-info button {
      width: 100%;
      margin-top: 15px;
      background: #f5c542;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .movie-info button:hover {
      background: #ffd60a;
    }

    @media(max-width:768px) {
      .hero-content h1 {
        font-size: 42px;
      }

      .hero {
        padding: 40px;
      }

      .nav-container {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-container">
      <h2>🎬 Poornima <span>Talkies</span></h2>

      <div class="nav-buttons">
        <button onclick="scrollToMovies()">Movies</button>
        <button onclick="goToAdmin()">Admin Login</button>
      </div>
    </div>
  </nav>

  <div class="hero">
    <div class="hero-content">
      <h1>Book Your <br><span>Movie Tickets</span> Easily 🍿</h1>
      <p>Experience fast and smooth movie booking for Poornima Talkies, Turuvekere.</p>
      <button onclick="scrollToMovies()">Book Now</button>
    </div>
  </div>

  <h2 class="section-title" id="movies">Now Showing</h2>

  <div class="movie-container" id="movieList">
  </div>

  <script>
    async function loadMovies() {
      try {
        const response = await fetch('https://poornima-talkies-backend.onrender.com/movies');
        const movies = await response.json();

        const container = document.getElementById('movieList');

        movies.forEach(movie => {
          container.innerHTML += `
            <div class="movie-card">
              <img src="${movie.poster_url}" alt="Movie Poster">

              <div class="movie-info">
                <h3>${movie.movie_name}</h3>
                <p>${movie.genre} • ${movie.duration} • ${movie.language}</p>
                <p>🕒 ${movie.show_time}</p>
                <p>📍 Poornima Talkies, Turuvekere</p>

                <button onclick="goToShow('${movie.movie_name}')">See More</button>
              </div>
            </div>
          `;
        });
      } catch (error) {
        console.log('Error loading movies:', error);
      }
    }

    function goToShow(movie) {
      localStorage.setItem('selectedMovie', movie);
      window.location.href = 'show.html';
    }

    function goToAdmin() {
      window.location.href = 'admin-login.html';
    }

    function scrollToMovies() {
      document.getElementById('movies').scrollIntoView({
        behavior: 'smooth'
      });
    }

    loadMovies();
  </script>

</body>
</html>
