<!DOCTYPE html>
<html>
<head>
  <title>Select Seats</title>

  <style>
    body {
      background: linear-gradient(to bottom, #08142e, #0b1e45);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 30px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #movieInfo {
      color: #f4c542;
      margin-bottom: 30px;
      font-size: 22px;
    }

    .screen {
      width: 60%;
      margin: 20px auto;
      background: #ddd;
      color: black;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      margin-bottom: 40px;
    }

    .seat-container {
      display: grid;
      grid-template-columns: repeat(11, 55px);
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .seat {
      width: 50px;
      height: 50px;
      background: #4f8cff;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .seat:hover {
      transform: scale(1.05);
    }

    .selected {
      background: #00d084;
    }

    .booked {
      background: red;
      cursor: not-allowed;
    }

    #total {
      margin: 20px 0;
      color: #f4c542;
    }

    input {
      width: 280px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 15px;
      font-size: 16px;
      text-align: center;
    }

    button {
      background: #f4c542;
      border: none;
      padding: 14px 30px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    .back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  background: #f5c542;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  z-index: 1000;
}

.back-btn:hover {
  background: #ffd60a;
}
  </style>
</head>

<body>
  <button class="back-btn" onclick="goBack()">← Back</button>

<h1>Select Seats</h1>

<h2 id="movieInfo"></h2>

<div class="screen">SCREEN</div>

<div class="seat-container" id="seats"></div>

<h3 id="total">Total: ₹0</h3>

<input type="tel" id="phoneNumber" placeholder="Enter Phone Number">

<br><br>

<button onclick="confirmBooking()">Confirm Booking</button>


<script>
 
  function goBack() {
    window.location.href = "show.html";
  }


const movie = localStorage.getItem("selectedMovie");
const time = localStorage.getItem("selectedTime");

let date = localStorage.getItem("selectedDate");

if(date.includes("T")){
    date = date.split("T")[0];
}

document.getElementById("movieInfo").innerHTML =
`
${movie}<br>
🕒 ${time}<br>
📅 ${date}
`;

const seatContainer = document.getElementById("seats");

let selectedSeats = [];

const price = 100;

const key = movie + "_" + time + "_" + date;

let bookedSeats = JSON.parse(localStorage.getItem(key)) || [];

const rows = ["A","B","C","D","E","F"];

rows.forEach(row => {

    for(let i=1;i<=10;i++){

        const seat = document.createElement("div");

        const seatName = row + i;

        seat.classList.add("seat");

        seat.innerText = seatName;

        if(bookedSeats.includes(seatName)){
            seat.classList.add("booked");
        }

        else{

            seat.onclick = () => {

                if(seat.classList.contains("selected")){

                    seat.classList.remove("selected");

                    selectedSeats = selectedSeats.filter(s => s !== seatName);

                }

                else{

                    seat.classList.add("selected");

                    selectedSeats.push(seatName);

                }

                updateTotal();
            };
        }

        seatContainer.appendChild(seat);

        if(i===5){

            const gap = document.createElement("div");

            gap.style.width = "30px";

            seatContainer.appendChild(gap);
        }
    }
});

function updateTotal(){

    document.getElementById("total").innerText =
    "Total: ₹" + selectedSeats.length * price;
}

async function confirmBooking(){

    const phone = document.getElementById("phoneNumber").value;

    if(phone.length !== 10){

        alert("Enter valid phone number");

        return;
    }

    if(selectedSeats.length === 0){

        alert("Select seats");

        return;
    }

    const response = await fetch("https://poornima-talkies-backend.onrender.com/book-seat",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body: JSON.stringify({

            movie_name: movie,

            show_time: time,

            show_date: date,

            seat_number: selectedSeats.join(", "),

            user_phone: phone
        })
    });

    const data = await response.json();

    if(data.success){

        bookedSeats.push(...selectedSeats);

        localStorage.setItem(key, JSON.stringify(bookedSeats));

        localStorage.setItem("selectedSeats", selectedSeats.join(", "));

        localStorage.setItem("selectedDate", date);

        localStorage.setItem("userPhone", phone);

        window.location.href = "confirmation.html";
    }

    else{

        alert("Booking Failed");
    }
}

</script>

</body>
</html>
